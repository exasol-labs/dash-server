name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The full suite starts real apps and worker processes; this bounds a hung one.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          # Same uv that writes uv.lock locally, so `--locked` judges it consistently.
          version: "0.9.24"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        # --locked fails if uv.lock has drifted from pyproject.toml, and pins mypy/ruff
        # to the locked versions so a new upstream release can't flip the gates below.
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        # `uv run ruff format src tests` fixes a failure. Golden fixtures are excluded
        # (pyproject.toml's [tool.ruff.format]): they must match generator output.
        run: uv run ruff format --check src tests

      - name: mypy
        # Paths come from `[tool.mypy] files` in pyproject.toml.
        run: uv run mypy

      - name: pytest
        # The whole suite, including the `slow` tests that start real apps, subprocess
        # workers, and background jobs. `pytest -m "not slow"` is the fast local loop.
        run: uv run pytest
