name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base: a PR into another PR's branch is checked too.
  pull_request:

# The jobs only read the repository; nothing in CI writes to it.
permissions:
  contents: read

# A new push to a pull request cancels its superseded run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commit SHAs, which cannot be moved the way tags can; the trailing
# comment names the release, and Dependabot (.github/dependabot.yml) keeps both up to date.

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The full suite starts real apps and worker processes; this bounds a hung one.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Every Python that `requires-python = ">=3.10"` admits and that is released.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # Same uv that writes uv.lock locally, so `--locked` judges it consistently.
          version: "0.13.10"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        # --locked fails if uv.lock has drifted from pyproject.toml, and pins mypy/ruff
        # to the locked versions so a new upstream release can't flip the gates below.
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        # `uv run ruff format src tests` fixes a failure. Golden fixtures are excluded
        # (pyproject.toml's [tool.ruff.format]): they must match generator output.
        run: uv run ruff format --check src tests

      - name: mypy
        # Paths come from `[tool.mypy] files` in pyproject.toml.
        run: uv run mypy

      - name: pytest
        # The whole suite, including the `slow` tests that start real apps, subprocess
        # workers, and background jobs. `pytest -m "not slow"` is the fast local loop.
        run: uv run pytest

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.12"

      - name: Audit the locked dependencies
        # Every locked package, dev extras included, checked against the PyPI and OSV advisory
        # databases; a known vulnerability fails the job.
        run: |
          uv export --locked --all-extras --no-hashes --no-emit-project --output-file requirements-audit.txt
          uvx pip-audit==2.10.1 --no-deps --disable-pip --requirement requirements-audit.txt

  image:
    name: container image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        env:
          ARCH: ${{ matrix.arch }}
        run: docker build --platform "linux/$ARCH" -t dash-server:ci .

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.12"
          enable-cache: true

      - name: Test the image
        run: |
          uv sync --locked --extra dev
          DASH_SERVER_TEST_IMAGE=dash-server:ci uv run pytest tests/test_container_image.py
