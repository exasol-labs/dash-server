name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          # Same uv that writes uv.lock locally, so `--locked` judges it consistently.
          version: "0.9.24"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        # --locked fails if uv.lock has drifted from pyproject.toml, and pins mypy/ruff
        # to the locked versions so a new upstream release can't flip the gates below.
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        # Advisory only (see pyproject.toml's ruff section) — the codebase has pre-existing
        # formatting drift that isn't auto-formatted yet, so this doesn't block CI.
        run: uv run ruff format --check src tests
        continue-on-error: true

      - name: mypy
        # Paths come from `[tool.mypy] files` in pyproject.toml.
        run: uv run mypy

      - name: pytest
        run: uv run pytest -m "not slow"
