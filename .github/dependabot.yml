version: 2
updates:
  # The SHA-pinned actions in .github/workflows; Dependabot updates the SHA and its version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Propose a release only after it has been out for a week, so a hijacked release that is
    # pulled within days never reaches a PR.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # uv.lock. Minor and patch releases arrive as one grouped PR; major releases one PR each.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Propose a release only after it has been out for a week, so a hijacked release that is
    # pulled within days never reaches a PR.
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
