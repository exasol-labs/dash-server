[build-system]
requires = ["setuptools>=82.0", "wheel>=0.47"]
build-backend = "setuptools.build_meta"

[project]
name = "dash-server"
version = "0.5.0"
description = "Stage 4 diagnostics slice for an agent-controlled Dash hosting server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.1,<4.0",
  "dash>=4.3,<5.0",
  "packaging>=26.2,<27.0",
  "pyexasol>=2.2.2,<3.0",
  "jsonschema>=4.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10.0",
  "mypy>=2.1",
  "types-jsonschema>=4.26.0.20260518",
  "ruff>=0.15.20",
]

[project.scripts]
dash-server = "dash_server.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# -----------------------------------------------------------------------------
# Lint / format (ruff)
# -----------------------------------------------------------------------------
# Invocation:
#   ruff check src tests              # lint
#   ruff format --check src tests     # formatting drift (advisory; no auto-format yet)
#
# The rule set is intentionally bug-leaning: pyflakes (F), bugbear (B), pyupgrade
# (UP), and simplify (SIM) flag real defects; we *don't* opt into E501 (line
# length) because the codebase has many long signatures and docstrings we don't
# want to churn-reformat. Style is mypy's neighbour, not its replacement.
#
# Tests get a relaxed list — assert-statements and fixture argument shadowing
# are pytest idioms, not bugs.

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["instance", ".venv"]

[tool.ruff.lint]
select = [
  "F",    # pyflakes — unused imports/vars, undefined names
  "E4",   # pycodestyle: import errors
  "E7",   # pycodestyle: statement errors
  "E9",   # pycodestyle: runtime errors
  "W",    # pycodestyle: warnings
  "B",    # bugbear — likely bugs (mutable default args, etc.)
  "UP",   # pyupgrade — modernize syntax (Optional → | None, etc.)
  "SIM",  # simplify — collapse needlessly verbose patterns
  "RUF",  # ruff-specific lints
]
ignore = [
  "B008",   # function call in default argument — we use `field(default_factory=...)` style consciously
  "SIM108", # ternary if-else — explicit if/else often reads clearer for non-trivial branches
  "SIM105", # `contextlib.suppress(...)` — our explicit try/except/pass is clearer at process-teardown sites
  "RUF012", # mutable class attribute defaults — usually intentional lookup tables, ClassVar churn isn't worth it
  "RUF002", # ambiguous unicode in docstring — en-dashes in prose are deliberate
  "RUF003", # ambiguous unicode in comment — same
  "E402",   # module-level imports not at top — used for deferred/optional imports
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "B011",   # assert False — pytest-style intentional failures
  "B017",   # `pytest.raises(Exception)` — broad on purpose in some specs
  "SIM117", # nested with-blocks — pytest fixtures often build them by hand
]

# -----------------------------------------------------------------------------
# Static type checking
# -----------------------------------------------------------------------------
# Invocation: `mypy src/dash_server src/dash_server_runtime`
#
# The baseline policy is "lenient with annotations honored": we don't require
# every function to be annotated, but where annotations exist they must agree.
# The per-module overrides at the bottom of this section raise the floor for the
# clean / recently-refactored / boundary-facing modules.
#
# pyexasol 1.3.0 ships no `py.typed` marker and almost no annotations, so it's
# silenced as a third-party untyped import; our own typed boundary lives in
# `dash_server.exasol._pyexasol_types`.

[tool.mypy]
python_version = "3.10"
files = ["src/dash_server", "src/dash_server_runtime"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
disallow_any_generics = true
check_untyped_defs = false  # raise per-module below
show_error_codes = true
explicit_package_bases = true
mypy_path = "src"

# Third parties without bundled type info — silence their import diagnostics so
# our own code can still be checked. (pyexasol 2.2+ ships `py.typed` so it's not
# in this list anymore; we still wrap its under-typed result-set surface — see
# `dash_server.exasol._pyexasol_types`.)
[[tool.mypy.overrides]]
module = [
  "dash",
  "dash.*",
]
ignore_missing_imports = true

# Recently-refactored / structurally clean surface — these get the strict floor.
[[tool.mypy.overrides]]
module = [
  "dash_server.timestamps",
  "dash_server.diagnostics.*",
  "dash_server.runtime.dispatcher",
  "dash_server.runtime.worker_manager",
  "dash_server.runtime.worker_proxy",
  "dash_server.dependencies.environment_service",
  "dash_server.exasol._pyexasol_types",
]
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
